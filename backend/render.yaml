services:
  - type: web
    name: focuslens-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: focuslens-db
          property: connectionString

  - type: psql
    name: focuslens-db
    plan: free
